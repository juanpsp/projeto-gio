<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Página nova — Ensemble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/tokens.css">

<style>

  .secao--alt { background: var(--papier-fonce); }
  .caixa { max-width: 1080px; margin: 0 auto; }
  @media (min-width: 768px) { .secao { padding: var(--espaco-9) var(--espaco-6); } }
</style>

<body>
<section class="secao">
  <div class="caixa">
    <p class="en-rotulo">Comece por aqui</p>
    <h1 class="en-display">On apprend <span class="en-sublinhado">ensemble</span>.</h1>
    <p class="en-lead">Troque este bloco pelo conteúdo real. As classes do sistema começam com <code>en-</code>.</p>
    <p style="margin-top:var(--espaco-5)"><a class="en-btn en-btn--primario" href="#contato">C'est parti!</a></p>
