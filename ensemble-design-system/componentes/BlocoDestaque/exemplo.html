<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/ensemble.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloco de destaque</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&amp;family=Figtree:ital,wght@0,400..800;1,400..700&amp;family=Fredoka:wght@400..700&amp;display=swap">
<style>.ds{padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;box-sizing:border-box}.ds-g{display:grid;gap:14px}.ds-lab{font:600 12px/16px var(--font-texto);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-douce);margin:0}.ds-row{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center}.ds-col{display:grid;gap:8px;justify-items:start}.ds-sub{font:500 13px/18px var(--font-texto);color:var(--encre-douce);margin:0}.dq{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center}.dq-t{flex:1 1 300px;display:grid;gap:14px}.dq-i{flex:0 0 auto}.dq-i svg{width:140px;height:140px;background:var(--papier);border-radius:50%;padding:10px;box-sizing:border-box}</style>
</head>
<body>
<div class="ds">
<section class="en-destaque"><span class="en-destaque__forma" aria-hidden="true"></span>
<div class="dq"><div class="dq-t"><span class="en-nota">sem pressão, prometo</span><h2 class="en-destaque__titulo">Bora destravar esse francês?</h2><p class="en-destaque__texto">Uma conversa rápida pra gente se conhecer, entender seu nível e ver qual formato combina com você.</p>
<div class="en-destaque__acoes"><button class="en-btn en-btn--primario">C'est parti!<svg class="en-icone en-btn__seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button><a class="en-link en-link--inverso" href="#">Ver formatos primeiro</a></div></div>
<div class="dq-i"><svg class="en-ilustracao" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M60 34v-2M52 36h16" stroke="#1b2545" stroke-width="3.5"/><path d="M54 36c-1 22-9 45-27 72M66 36c1 22 9 45 27 72" stroke="#1b2545" stroke-width="3.5"/><path d="M50 62h20M42 83h36" stroke="#1b2545" stroke-width="3.5"/><path d="M48 108c0-11 5.4-18 12-18s12 7 12 18M20 108h12M88 108h12" stroke="#1b2545" stroke-width="3.5"/><path d="M57 48l6 8M63 48l-6 8M53 70l14 9M67 70l-14 9" stroke="#0055a4" stroke-width="2.5"/><g transform="rotate(-14 60 24)"><path d="M40 26c0-7 9-12 20-12s20 4.5 20 11c0 4.5-8 7-20 7s-20-2-20-6Z" fill="#ef4135" stroke="#1b2545" stroke-width="3.5"/><path d="M60 14c0-3 1.3-5 4-5.5" stroke="#1b2545" stroke-width="3.5"/></g><path d="M96 30c.5 4 2.8 6.2 6.8 6.8-4 .5-6.2 2.8-6.8 6.8-.5-4-2.8-6.2-6.8-6.8 4-.6 6.2-2.8 6.8-6.8Z" fill="#ffd970" stroke="#1b2545" stroke-width="2"/></svg></div></div></section>
<section class="en-destaque en-destaque--beurre"><span class="en-destaque__forma" aria-hidden="true"></span><span class="en-nota">travou numa palavra?</span><h2 class="en-destaque__titulo">Normal. A gente destrava junto.</h2><div class="en-destaque__acoes"><button class="en-btn en-btn--secundario">Marcar conversa</button></div></section>
<section class="en-destaque en-destaque--ciel"><span class="en-destaque__forma" aria-hidden="true"></span><h2 class="en-destaque__titulo" style="font-size:26px">Eu também ainda estou aprendendo. <span class="en-marca-texto">E é por isso que funciona.</span></h2></section>
</div>
</body>
</html>
