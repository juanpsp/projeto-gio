<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/ensemble.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&amp;family=Figtree:ital,wght@0,400..800;1,400..700&amp;family=Fredoka:wght@400..700&amp;display=swap">
<style>.ds{padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;box-sizing:border-box}.ds-g{display:grid;gap:14px}.ds-lab{font:600 12px/16px var(--font-texto);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-douce);margin:0}.ds-row{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center}.ds-col{display:grid;gap:8px;justify-items:start}.ds-sub{font:500 13px/18px var(--font-texto);color:var(--encre-douce);margin:0}.mx{display:grid;gap:22px}.mx-r{display:grid;gap:10px}.mx-h{font:500 12px/1 var(--font-texto);color:var(--encre-douce);padding-left:4px}.mx-l{font:700 14px/1 var(--font-texto);margin:0}
.azul{display:grid;gap:14px;padding:20px;border-radius:24px;background:var(--bleu);max-width:380px;box-sizing:border-box}</style>
</head>
<body>
<div class="ds">
<div class="ds-g"><p class="ds-lab">Variantes × estados</p>
<div class="mx"><div class="mx-r"><p class="mx-l">Primário</p><div class="ds-row" style="gap:14px 18px;align-items:flex-start"><div class="ds-col"><button class="en-btn en-btn--primario">C'est parti!</button><span class="mx-h">normal</span></div><div class="ds-col"><button class="en-btn en-btn--primario is-hover">C'est parti!</button><span class="mx-h">hover</span></div><div class="ds-col"><button class="en-btn en-btn--primario is-pressed">C'est parti!</button><span class="mx-h">pressionado</span></div><div class="ds-col"><button class="en-btn en-btn--primario is-focus">C'est parti!</button><span class="mx-h">foco (teclado)</span></div></div></div><div class="mx-r"><p class="mx-l">Secundário</p><div class="ds-row" style="gap:14px 18px;align-items:flex-start"><div class="ds-col"><button class="en-btn en-btn--secundario">Marcar conversa</button><span class="mx-h">normal</span></div><div class="ds-col"><button class="en-btn en-btn--secundario is-hover">Marcar conversa</button><span class="mx-h">hover</span></div><div class="ds-col"><button class="en-btn en-btn--secundario is-pressed">Marcar conversa</button><span class="mx-h">pressionado</span></div><div class="ds-col"><button class="en-btn en-btn--secundario is-focus">Marcar conversa</button><span class="mx-h">foco (teclado)</span></div></div></div><div class="mx-r"><p class="mx-l">Contorno</p><div class="ds-row" style="gap:14px 18px;align-items:flex-start"><div class="ds-col"><button class="en-btn en-btn--contorno">Ver formatos</button><span class="mx-h">normal</span></div><div class="ds-col"><button class="en-btn en-btn--contorno is-hover">Ver formatos</button><span class="mx-h">hover</span></div><div class="ds-col"><button class="en-btn en-btn--contorno is-pressed">Ver formatos</button><span class="mx-h">pressionado</span></div><div class="ds-col"><button class="en-btn en-btn--contorno is-focus">Ver formatos</button><span class="mx-h">foco (teclado)</span></div></div></div></div></div>
<div class="ds-g"><p class="ds-lab">Com ícone</p><div class="ds-row">
<button class="en-btn en-btn--primario">C'est parti!<svg class="en-icone en-btn__seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button>
<button class="en-btn en-btn--secundario"><svg class="en-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg>Marcar conversa</button>
<button class="en-btn en-btn--contorno"><svg class="en-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h14a2 2 0 0 1 2 2V15a2 2 0 0 1-2 2h-8l-4.5 3.5V17H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2Z"/><path d="M8 10.8h.01M12 10.8h.01M16 10.8h.01"/></svg>Mandar mensagem</button>
<button class="en-btn en-btn--primario en-btn--icone" aria-label="Mandar mensagem"><svg class="en-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h14a2 2 0 0 1 2 2V15a2 2 0 0 1-2 2h-8l-4.5 3.5V17H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2Z"/><path d="M8 10.8h.01M12 10.8h.01M16 10.8h.01"/></svg></button>
<button class="en-btn en-btn--contorno en-btn--icone" aria-label="Ouvir pronúncia"><svg class="en-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><path d="M4 14.5h2.5A1.5 1.5 0 0 1 8 16v3a1.5 1.5 0 0 1-1.5 1.5h-1A1.5 1.5 0 0 1 4 19v-4.5ZM20 14.5h-2.5A1.5 1.5 0 0 0 16 16v3a1.5 1.5 0 0 0 1.5 1.5h1A1.5 1.5 0 0 0 20 19v-4.5Z"/></svg></button>
</div></div>
<div class="ds-g"><p class="ds-lab">Tamanhos</p><div class="ds-row">
<button class="en-btn en-btn--primario en-btn--grande">Quero começar<svg class="en-icone en-btn__seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button>
<button class="en-btn en-btn--primario">Quero começar</button>
<button class="en-btn en-btn--primario en-btn--pequeno">Quero começar</button>
<button class="en-btn en-btn--contorno" disabled>Enviando…</button>
</div></div>
<div class="ds-g"><p class="ds-lab">Largura total (celular) · sobre fundo azul</p>
<div class="azul"><button class="en-btn en-btn--primario en-btn--bloco">Bora destravar esse francês<svg class="en-icone en-btn__seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button><button class="en-btn en-btn--claro en-btn--bloco">Tirar uma dúvida antes</button></div></div>
</div>
</body>
</html>
