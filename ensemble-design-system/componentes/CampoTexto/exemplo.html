<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/ensemble.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campo de texto</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&amp;family=Figtree:ital,wght@0,400..800;1,400..700&amp;family=Fredoka:wght@400..700&amp;display=swap">
<style>.ds{padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;box-sizing:border-box}.ds-g{display:grid;gap:14px}.ds-lab{font:600 12px/16px var(--font-texto);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-douce);margin:0}.ds-row{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center}.ds-col{display:grid;gap:8px;justify-items:start}.ds-sub{font:500 13px/18px var(--font-texto);color:var(--encre-douce);margin:0}.frm{display:grid;gap:22px;max-width:460px}.frm .en-btn{justify-self:start}</style>
</head>
<body>
<div class="ds"><form class="frm" action="#">
<div class="en-campo"><label class="en-campo__rotulo" for="n">Comment tu t'appelles? <span class="en-nota">(seu nome)</span></label><input class="en-input" id="n" placeholder="Seu nome ou apelido"></div>
<div class="en-campo"><label class="en-campo__rotulo" for="e">Seu e-mail</label><input class="en-input is-focus" id="e" type="email" value="camila@exemplo.com"><p class="en-campo__ajuda">Estado de foco. Só pra combinar a primeira conversa.</p></div>
<div class="en-campo en-campo--erro"><label class="en-campo__rotulo" for="w">WhatsApp</label><input class="en-input" id="w" value="(21) 9999-999" aria-invalid="true" aria-describedby="w-e"><p class="en-campo__erro" id="w-e"><svg class="en-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14c.8 1.3 2.1 2 3.5 2s2.7-.7 3.5-2M9 9.5v1M15 9.5v1"/></svg>Opa, parece que faltou um número. Confere pra mim?</p></div>
<div class="en-campo"><label class="en-campo__rotulo" for="s">Seu nível hoje</label><select class="en-input" id="s"><option>Nunca estudei (zéro!)</option><option>Sei o básico</option><option>Me viro bem</option></select></div>
<div class="en-campo"><label class="en-campo__rotulo" for="t">Por que francês?</label><textarea class="en-input" id="t" placeholder="Viagem, trabalho, amor, série francesa… vale tudo."></textarea></div>
<div class="en-campo"><label class="en-campo__rotulo" for="d">Desativado</label><input class="en-input" id="d" value="Não dá pra editar" disabled></div>
<button class="en-btn en-btn--primario">Envoyer!<svg class="en-icone en-btn__seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button>
</form></div>
</body>
</html>
