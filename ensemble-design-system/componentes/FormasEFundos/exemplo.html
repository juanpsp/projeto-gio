<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/ensemble.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formas e fundos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&amp;family=Figtree:ital,wght@0,400..800;1,400..700&amp;family=Fredoka:wght@400..700&amp;display=swap">
<style>.ds{padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;box-sizing:border-box}.ds-g{display:grid;gap:14px}.ds-lab{font:600 12px/16px var(--font-texto);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-douce);margin:0}.ds-row{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center}.ds-col{display:grid;gap:8px;justify-items:start}.ds-sub{font:500 13px/18px var(--font-texto);color:var(--encre-douce);margin:0}</style>
</head>
<body>
<div class="ds">
<div class="ds-g"><p class="ds-lab">Formas orgânicas (atrás de fotos e ilustrações)</p><div class="ds-row" style="gap:24px">
<span class="en-forma" style="width:150px"></span><span class="en-forma en-forma--beurre" style="width:130px"></span><span class="en-forma en-forma--rose en-forma--anima" style="width:140px"></span></div></div>
<div class="ds-g"><p class="ds-lab">Fundo caderno (pauta Seyès, das escolas francesas)</p>
<div class="en-fundo-caderno" style="border-radius:20px;padding:30px 24px 30px 70px;max-width:520px;border:1.5px solid var(--ligne)"><p class="en-nota en-nota--grande en-nota--encre" style="margin:0">Leçon n° 1 : on se lance!</p><p class="en-nota" style="margin:6px 0 0">(sem medo, prometo)</p></div></div>
</div>
</body>
</html>
