<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/ensemble.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card de depoimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&amp;family=Figtree:ital,wght@0,400..800;1,400..700&amp;family=Fredoka:wght@400..700&amp;display=swap">
<style>.ds{padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;box-sizing:border-box}.ds-g{display:grid;gap:14px}.ds-lab{font:600 12px/16px var(--font-texto);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-douce);margin:0}.ds-row{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center}.ds-col{display:grid;gap:8px;justify-items:start}.ds-sub{font:500 13px/18px var(--font-texto);color:var(--encre-douce);margin:0}</style>
</head>
<body>
<div class="ds">
<div class="en-grade" style="padding-top:24px;gap:36px 24px">
<figure class="en-card en-card--depoimento" style="margin:0"><blockquote class="en-card__citacao" style="margin:0 0 24px">Eu travava só de pensar em falar francês. Hoje eu erro, dou risada e sigo falando.</blockquote>
<figcaption class="en-autor"><span class="en-avatar">CR</span><span><span class="en-autor__nome">Camila R.</span><span class="en-autor__info">Nível B1 · aluna há 1 ano</span></span></figcaption></figure>
<figure class="en-card en-card--depoimento en-card--carimbo" style="margin:0"><blockquote class="en-card__citacao" style="margin:0 0 24px">As aulas passam voando. Parece papo entre amigos, só que em francês.</blockquote>
<figcaption class="en-autor"><span class="en-avatar en-avatar--beurre">RT</span><span><span class="en-autor__nome">Rafael T.</span><span class="en-autor__info">Nível A2 · online</span></span></figcaption></figure>
<figure class="en-depoimento-balao" style="margin:0"><blockquote class="en-bulle en-bulle--ciel" style="margin:0 0 26px">Finalmente entendi a diferença entre <i>tu</i> e <i>vous</i>! Merci, prof.</blockquote>
<figcaption class="en-autor"><span class="en-avatar en-avatar--rose">BL</span><span><span class="en-autor__nome">Beatriz L.</span><span class="en-autor__info">Nível A1 · começou do zero</span></span></figcaption></figure>
</div>
<p class="ds-sub">Textos e nomes de exemplo: troque por depoimentos reais, com autorização dos alunos.</p>
</div>
</body>
</html>
