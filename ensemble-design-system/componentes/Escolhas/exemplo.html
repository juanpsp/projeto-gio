<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/ensemble.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escolhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&amp;family=Figtree:ital,wght@0,400..800;1,400..700&amp;family=Fredoka:wght@400..700&amp;display=swap">
<style>.ds{padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;box-sizing:border-box}.ds-g{display:grid;gap:14px}.ds-lab{font:600 12px/16px var(--font-texto);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-douce);margin:0}.ds-row{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center}.ds-col{display:grid;gap:8px;justify-items:start}.ds-sub{font:500 13px/18px var(--font-texto);color:var(--encre-douce);margin:0}</style>
</head>
<body>
<div class="ds">
<fieldset class="en-escolhas"><legend>Qual é o seu nível?</legend>
<label class="en-escolha"><input type="radio" name="nv"><span>Nunca estudei</span></label>
<label class="en-escolha"><input type="radio" name="nv" checked><span>Sei o básico</span></label>
<label class="en-escolha"><input type="radio" name="nv"><span>Me viro</span></label>
<label class="en-escolha"><input type="radio" name="nv"><span>Quero fluência</span></label></fieldset>
<div style="display:grid;gap:14px">
<label class="en-check"><input type="checkbox" checked>Quero receber dicas de francês por e-mail (prometo não lotar sua caixa)</label>
<label class="en-check"><input type="checkbox">Li e aceito a política de privacidade</label></div>
</div>
</body>
</html>
