<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/ensemble.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divisores</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&amp;family=Figtree:ital,wght@0,400..800;1,400..700&amp;family=Fredoka:wght@400..700&amp;display=swap">
<style>.ds{padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;box-sizing:border-box}.ds-g{display:grid;gap:14px}.ds-lab{font:600 12px/16px var(--font-texto);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-douce);margin:0}.ds-row{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center}.ds-col{display:grid;gap:8px;justify-items:start}.ds-sub{font:500 13px/18px var(--font-texto);color:var(--encre-douce);margin:0}</style>
</head>
<body>
<div class="ds" style="gap:18px">
<p class="ds-lab">onda</p><hr class="en-divisor" style="margin:0">
<p class="ds-lab">onda curta · bandeira · estrelinha · rabisco</p>
<hr class="en-divisor en-divisor--curto" style="margin:4px 0"><hr class="en-divisor en-divisor--bandeira" style="margin:4px 0"><hr class="en-divisor en-divisor--estrelas" style="margin:4px 0"><hr class="en-divisor en-divisor--rabisco" style="margin:4px 0">
<p class="ds-lab">borda ondulada entre seções</p>
<div style="border-radius:16px;overflow:hidden;border:1.5px solid var(--ligne)"><div style="height:36px;background:var(--papier)"></div><div class="en-borda-onda"></div><div style="height:36px;background:var(--papier-fonce)"></div></div>
</div>
</body>
</html>
