<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/ensemble.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabiscos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&amp;family=Figtree:ital,wght@0,400..800;1,400..700&amp;family=Fredoka:wght@400..700&amp;display=swap">
<style>.ds{padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;box-sizing:border-box}.ds-g{display:grid;gap:14px}.ds-lab{font:600 12px/16px var(--font-texto);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-douce);margin:0}.ds-row{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center}.ds-col{display:grid;gap:8px;justify-items:start}.ds-sub{font:500 13px/18px var(--font-texto);color:var(--encre-douce);margin:0}.en-anotacao svg{width:70px}</style>
</head>
<body>
<div class="ds" style="gap:34px">
<div class="ds-g"><p class="ds-lab">Sublinhados, círculo e marca-texto</p>
<p class="en-h2">A gente aprende <span class="en-sublinhado">junto</span>.</p>
<p class="en-h2"><span class="en-circulado">Sem medo</span> de errar.</p>
<p class="en-h2">Francês <span class="en-marca-texto">leve e divertido</span>.</p>
<p class="en-h2">Uma aula <span class="en-sublinhado en-sublinhado--traco">de verdade</span>, com <span class="en-sublinhado en-sublinhado--bleu">conversa</span>.</p></div>
<div class="ds-g"><p class="ds-lab">Setas e anotações à mão</p><div class="ds-row" style="gap:28px;align-items:flex-end">
<span class="en-anotacao">é aqui que a mágica acontece <svg class="" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12c20 44 56 58 96 40" stroke="#1b2545" stroke-width="3"/><path d="M90 42l15 9-12 13" stroke="#1b2545" stroke-width="3"/></svg></span>
<span class="en-anotacao en-anotacao--rouge"><svg class="" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 64c22 0 38-18 32-32-6-12-22-5-14 8 10 16 48 20 80-10" stroke="#0055a4" stroke-width="3"/><path d="M92 28l13 1-3 13" stroke="#0055a4" stroke-width="3"/></svg> olha isso!</span>
<span class="en-brilhos" aria-hidden="true"></span><span class="en-estrelinha" aria-hidden="true"></span></div></div>
<div class="ds-g"><p class="ds-lab">Foto com fita adesiva</p><div class="ds-row" style="gap:40px;padding:14px 8px 8px">
<figure class="en-foto" style="width:190px;margin:0"><span class="en-fita" aria-hidden="true"></span><div class="en-foto__imagem" style="aspect-ratio:1;background:var(--ciel);display:grid;place-items:center"><svg class="en-ilustracao" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 90C12 58 34 30 60 30s48 28 46 60c-10-12-26-18-46-18s-36 6-46 18Z" fill="#ffd970" stroke="#1b2545" stroke-width="3.5"/><path d="M44 34c3 11 4.5 23 3.5 38.5M76 34c-3 11-4.5 23-3.5 38.5M28 50c4 8 6 16 6 27M92 50c-4 8-6 16-6 27" stroke="#1b2545" stroke-width="3"/><path d="M53.5 50.5q3-3.2 6 0" stroke="#1b2545" stroke-width="3"/><circle cx="67" cy="49.5" r="2.6" fill="#1b2545"/><path d="M55 58q5 5 10 0" stroke="#1b2545" stroke-width="3"/><circle cx="51" cy="58" r="3" fill="#ef4135" opacity=".45"/><circle cx="70" cy="58" r="3" fill="#ef4135" opacity=".45"/><path d="M98 20c.5 4.5 3 7 7.5 7.5-4.5.5-7 3-7.5 7.5-.5-4.5-3-7-7.5-7.5 4.5-.5 7-3 7.5-7.5Z" fill="#ef4135"/><path d="M22 24l-4-5M30 19l-1-6" stroke="#0055a4" stroke-width="3"/></svg></div><figcaption class="en-foto__legenda">Paris, 2023</figcaption></figure>
<figure class="en-foto en-foto--dir" style="width:170px;margin:0"><span class="en-fita en-fita--ciel" aria-hidden="true"></span><div class="en-foto__imagem" style="aspect-ratio:4/5;background:var(--rose)"></div><figcaption class="en-foto__legenda">sua foto aqui</figcaption></figure>
</div></div>
</div>
</body>
</html>
