<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/ensemble.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card de número</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&amp;family=Figtree:ital,wght@0,400..800;1,400..700&amp;family=Fredoka:wght@400..700&amp;display=swap">
<style>.ds{padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;box-sizing:border-box}.ds-g{display:grid;gap:14px}.ds-lab{font:600 12px/16px var(--font-texto);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-douce);margin:0}.ds-row{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center}.ds-col{display:grid;gap:8px;justify-items:start}.ds-sub{font:500 13px/18px var(--font-texto);color:var(--encre-douce);margin:0}</style>
</head>
<body>
<div class="ds">
<div class="en-grade" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))">
<div class="en-card en-card--numero"><span class="en-numero">4 anos</span><p class="en-card__rotulo">dando aula de francês</p><span class="en-nota">e contando!</span></div>
<div class="en-card en-card--numero en-card--ciel"><span class="en-numero">120+</span><p class="en-card__rotulo">alunos já passaram por aqui</p><span class="en-nota en-nota--rouge">cada um com seu sotaque</span></div>
<div class="en-card en-card--numero en-card--beurre en-card--rouge"><span class="en-numero">30</span><p class="en-card__rotulo">alunos ativos agora</p><span class="en-nota en-nota--encre">tem lugar pra você?</span></div>
<div class="en-card en-card--numero en-card--carimbo"><span class="en-numero">0</span><p class="en-card__rotulo">julgamentos por erro</p><span class="en-nota">promessa de prof</span></div>
</div>
<p class="ds-sub">Números de exemplo: substitua pelos reais antes de publicar.</p>
</div>
</body>
</html>
